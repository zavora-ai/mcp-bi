[package]
name = "mcp-bi"
version = "0.1.1"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Business Intelligence MCP Server — read, drill into and render the saved dashboards an organisation already has. Apache Superset is the primary open-source backend, with Metabase alongside it and Power BI, Tableau, Looker, Qlik Sense and Amazon QuickSight as optional backends behind one interface. Returns the numbers behind a visual, computes the statistics worth citing, and draws charts server-side with charts-rs"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-bi"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "bi", "superset", "dashboard", "analytics"]
categories = ["development-tools"]
readme = "README.md"
rust-version = "1.94.1"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
base64 = "0.22"
# Server-side chart rendering: no browser, no JavaScript, no headless Chrome.
charts-rs = { version = "1", features = ["png"] }
urlencoding = "2"

[features]
default = []
# Exposes the fixture-backed HTTP client outside tests, so a host embedding this
# crate can exercise a vendor adapter without that vendor's account.
recorded-http = []

[workspace]
